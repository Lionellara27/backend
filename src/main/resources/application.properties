spring.application.name=backend

# Puerto de la API
server.port=8080

# CONEXION PRO A SQLITE (Guarda la BD en Documentos/NakelSoftware)
spring.datasource.url=jdbc:sqlite:${user.home}/Documents/NakelSoftware/base_datos_nakel.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Ya no se necesita usuario y contrasena porque es un archivo local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de email (Si no lo usas ahora, no molesta)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=tu_clave_de_aplicacion_de_16_letras
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cuando una pantalla muestra muchas filas (ej: 20 ventas con sus articulos y pagos), en vez de hacer
# una consulta por cada fila se traen de a 50 juntas. El Historial de ventas pasaba de 85 consultas a unas pocas.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Tope de seguridad: ninguna pantalla puede pedir mas de 200 filas de una sola vez, aunque lo intente.
# (Sin esto, un pedido con size=100000 traia la tabla entera a memoria.)
spring.data.web.pageable.max-page-size=200
